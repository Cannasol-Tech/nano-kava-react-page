# Documentation of record only: this install reads _bmad/custom/bmad-create-story.toml and bmad-sprint-planning.toml (there is no SM agent skill).
memories:
  - 'Load docs/SOP/story-frontmatter.md; all SOPs in docs/SOP/ are MANDATORY for this project'
  - 'Trello is not used for this project (Stephen, 2026-11-06) — no cards, no Trello-Card-ID field'
  - 'Sprint status saves to _bmad-output/implementation-artifacts/sprint-status.yaml'
  - 'Stories organized by epic: _bmad-output/implementation-artifacts/epic-<num>/<epic>-<story>-<slug>.md'
  - 'Story naming: <epic_num>-<story_num>-<descriptive-slug>.md (e.g., 1-1-site-pages-and-discoverability.md)'
  - 'Each story acceptance criteria must reference specific FR-<EE><NN> requirement IDs from the PRD'
  - 'Acceptance test scenarios must be tagged @FR_<EE><NN> AND @story_<epic>_<story> (underscores), plus one tier tag (@e2e or @service) and, for @e2e, one surface tag (@web)'
  - 'A user_flows.feature file must exist at test/acceptance/features/user_flows.feature'
  - 'Valid statuses: backlog, ready-for-dev, in-progress, blocked, review, done'
  - 'Blocked stories MUST have a Blocked-Reason in frontmatter -- never block without a reason'
  - 'The stock sprint_plan.py rejects the blocked status and generate overwrites it — restore blocked stories by hand after generate'
critical_actions:
  - 'When creating stories, create epic directory if needed and use correct naming convention'
  - 'Verify each story maps to specific FR-<EE><NN> requirements and note the tag mapping'
  - 'Remind dev that acceptance tests require dual tags: @FR_<EE><NN> and @story_<epic>_<story>'
