# Documentation of record only: this install reads _bmad/custom/bmad-agent-dev.toml (and bmad-dev-story.toml, bmad-build.toml).
memories:
  - 'Load docs/SOP/coding-style.md, docs/SOP/file-headers.md and docs/SOP/makefile-standard.md; all SOPs in docs/SOP/ are MANDATORY'
  - 'Trello is not used for this project (Stephen, 2026-11-06) — status lives in the story file and sprint-status.yaml only'
  - 'Acceptance features: test/acceptance/features/epic-<N>-<slug>.feature (one per epic) + user_flows.feature; steps test/acceptance/steps/test_epic_<N>.py; shared steps steps/common.py; fixtures and all-epic steps test/acceptance/conftest.py'
  - 'Every scenario MUST have both tags: @FR_<EE><NN> AND @story_<epic>_<story> (underscores)'
  - 'Example: @FR_0103 @story_1_1 — FR-0103 (Feature 01, FR 03) plus Epic 1, Story 1'
  - 'Every scenario carries exactly one tier tag (@e2e or @service); @e2e carries exactly one surface tag (@web); @service carries none'
  - 'Acceptance is end-to-end: @service only for what nothing with a screen can observe'
  - 'A user_flows.feature MUST exist at test/acceptance/features/user_flows.feature'
  - 'user_flows.feature must test ALL paths from _bmad-output/planning-artifacts/user-flows/user-flows.md'
  - 'When implementing user-flow-related stories, always update user_flows.feature'
  - 'Planning artifacts are in _bmad-output/planning-artifacts/ -- refer to PRD.md for FR-* mappings'
  - 'Multiple @FR_ tags allowed per scenario if it validates multiple requirements'
  - 'Stories live in _bmad-output/implementation-artifacts/epic-<num>/ with naming <epic>-<story>-<slug>.md'
  - 'Valid statuses: backlog, ready-for-dev, in-progress, blocked, review, done'
  - 'When blocked: set Status to blocked, Blocked to true, and provide Blocked-Reason -- REQUIRED'
  - 'When unblocking: set Blocked to false, clear Blocked-Reason, update Status'
  - 'RTM is docs/REQUIREMENTS_TRACEABILITY_MATRIX.md'
  - 'make test-acceptance (full run) produces the functionality report; make test-acceptance FR=0101 writes JUnit only'
  - 'Release versioning per docs/SOP/release-versioning.md: frontend (repo root, package.json, frontend/v) and api (functions/, functions/package.json, api/v)'
  - 'HOURS-LOG GATE: _bmad-output/hours-log/config.json has enabled:true, so a story cannot reach done until its hours-log entry is reviewed via /silverline-hours-log-review (Accept, a typed entry, or "No entry needed"). Run it as the final DoD step.'
critical_actions:
  - 'After implementing a story, create/update acceptance test scenarios with proper dual tagging'
  - 'Check if implemented story affects user flows and update user_flows.feature accordingly'
  - 'Verify all Definition of Done items are checked before marking story complete'
  - 'When changing story status, update story file AND sprint-status.yaml'
  - 'Before flipping a story to done, run /silverline-hours-log-review and require Accept or "No entry needed" first'
