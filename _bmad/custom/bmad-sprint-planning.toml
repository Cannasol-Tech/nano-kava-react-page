# Silverline BMAD conventions for bmad-sprint-planning (Nano Kava); preserved across `npx bmad-method install`.

[workflow]

persistent_facts = [
  "file:{project-root}/_bmad-output/project-context.md",
  "All SOPs in {project-root}/docs/SOP/ are MANDATORY for this project.",
  "TRELLO IS NOT USED for this project (Stephen, 2026-11-06): sprint planning moves no cards and makes no Trello MCP call.",
  "Sprint status saves to _bmad-output/implementation-artifacts/sprint-status.yaml.",
  "Stories are organized by epic: _bmad-output/implementation-artifacts/epic-<num>/<epic>-<story>-<slug>.md (e.g. 1-1-site-pages-and-discoverability.md).",
  "Each story's acceptance criteria cite specific FR-<EE><NN> IDs from _bmad-output/planning-artifacts/PRD.md.",
  "Acceptance scenarios are tagged @FR_<EE><NN> AND @story_<epic>_<story>, with underscores; test/acceptance/features/user_flows.feature must exist.",
  "Valid story statuses: backlog, ready-for-dev, in-progress, blocked, review, done. A blocked story MUST carry a Blocked-Reason in its story file.",
  "TRAP: scripts/sprint_plan.py does not know the Silverline status blocked. validate reports it as illegal, generate REPLACES it with the computed status, and --set <key>=blocked is refused. Before running generate, note every blocked story and restore each one afterwards by hand-editing sprint-status.yaml.",
  "There are no epic files yet: the Features table in PRD.md is the epic list, so generate has nothing to parse. Maintain sprint-status.yaml by hand against sprint-status-template.yaml and use only the validate and status subcommands, until _bmad-output/planning-artifacts/epics/ holds epic files.",
  "sprint-status.yaml timestamps are absolute; sprint_plan.py accepts YYYY-MM-DD HH:MM as well as MM-DD-YYYY HH:MM.",
  "CRITICAL ACTION: verify each story maps to specific FR-<EE><NN> requirements before marking it ready-for-dev.",
]
