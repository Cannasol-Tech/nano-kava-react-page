            "@type": "Answer",
            "text": "Nano Kava is a nanoemulsified form of Kava extract where particles are reduced to approximately 18 nanometers in size. This dramatically increases bioavailability (up to 10x compared to traditional Kava) and reduces onset time to just 5 minutes."

        {
          "@type": "Question",
          "name": "How fast does nano Kava work?",

            "@type": "Answer",

        },
        {
          "@type": "Question",
          "name": "What makes Cannasol's ~18nm particle size special?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our ~18nm particle size is the smallest in the industry. Smaller particles mean faster absorption, higher bioavailability of kavalactones, crystal-clear formulations with no cloudiness, and better shelf stability with no separation."
          }
        },
        {
          "@type": "Question",
          "name": "Will nano Kava make my beverage cloudy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No! One of the key benefits of our ~18nm particle size is crystal-clear formulations. Traditional Kava extracts create cloudy beverages. Our nano Kava stays perfectly clear and stable."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get samples before ordering?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! We encourage all potential partners to test our nano Kava in their formulations before committing to an order. Contact us to request samples."
          }
        }
      ]
    }
