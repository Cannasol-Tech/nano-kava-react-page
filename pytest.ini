# file: pytest.ini
# author: Stephen Boyett
#
# description:
#   pytest configuration for the acceptance suite (test/acceptance/). Run it through
#   `make test-acceptance`, which adds the JUnit path and the FR= / STORY= marker filters.
#
# See Also:
#   test/acceptance/README.md
#
# ---
# Copyright © 2026 Cannasol Technologies LLC. All Rights Reserved.
# ---

[pytest]
testpaths = test/acceptance
bdd_features_base_dir = test/acceptance/features
junit_family = xunit2
junit_suite_name = e2e
addopts = -ra --strict-markers
filterwarnings =
    ignore:usefixtures\(\) in .* without arguments has no effect:pytest.PytestWarning
